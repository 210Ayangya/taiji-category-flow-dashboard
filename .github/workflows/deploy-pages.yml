name: Deploy intent dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: intent-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download dashboard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          base="https://multi-category-intent-center.ayangya151546.chatgpt.site"
          for file in index.html styles.css data.js channel-quality.js app.js; do
            curl --fail --location --retry 5 --retry-delay 2 "$base/$file" --output "site/$file"
          done
          node - <<'NODE' > data-files.txt
          global.window = {}
          require('./site/data.js')
          for (const period of window.DASHBOARD_META.periods || []) {
            for (const file of period.files || []) console.log(file)
          }
          NODE
          while IFS= read -r file; do
            mkdir -p "site/$(dirname "$file")"
            curl --fail --location --retry 5 --retry-delay 2 "$base/$file" --output "site/$file"
          done < data-files.txt
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
